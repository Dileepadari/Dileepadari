name: Generate GitHub Stat Images

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stat cards (keep old image if fetch fails)
        run: |
          mkdir -p assets
          fetch() {
            url="$1"; out="$2"
            tmp="$(mktemp)"
            code=$(curl -sL -o "$tmp" -w '%{http_code}' "$url")
            if [ "$code" = "200" ] && grep -q '<svg' "$tmp"; then
              mv "$tmp" "assets/$out"
              echo "OK   $out"
            else
              echo "SKIP $out (http $code) — keeping previous version"
              rm -f "$tmp"
            fi
          }

          fetch "https://github-readme-stats.vercel.app/api?username=Dileepadari&show_icons=true&theme=tokyonight&rank_icon=github&include_all_commits=true&count_private=true" "stats.svg"
          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=Dileepadari&layout=compact&langs_count=8&theme=tokyonight" "top-langs.svg"
          fetch "https://streak-stats.demolab.com?user=Dileepadari&theme=tokyonight" "streak.svg"
          fetch "https://github-profile-trophy.vercel.app/?username=Dileepadari&theme=tokyonight&no-frame=true&row=2&column=4" "trophies.svg"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh github stat images"
          git push
